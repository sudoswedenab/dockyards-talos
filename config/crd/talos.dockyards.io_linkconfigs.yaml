apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: linkconfigs.talos.dockyards.io
spec:
  group: talos.dockyards.io
  names:
    kind: LinkConfig
    listKind: LinkConfigList
    plural: linkconfigs
    singular: linkconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: LinkConfig stores static and default route settings applied to
          Talos-managed nodes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines desired routing configuration for this resource.
            properties:
              defaultRoute:
                description: DefaultRoute defines the default route configuration.
                properties:
                  gateway:
                    description: Gateway is the next-hop gateway for the default route.
                    type: string
                  interface:
                    description: Interface is the network interface used for the default
                      route.
                    type: string
                  metric:
                    description: Metric is the route priority. Lower values are preferred.
                    format: int32
                    type: integer
                required:
                - interface
                type: object
              staticRoutes:
                description: StaticRoutes lists destination-specific static routes
                  to apply.
                items:
                  description: LinkConfigRoute defines a static route that Talos should
                    configure on a node.
                  properties:
                    gateway:
                      description: Gateway is the next-hop gateway for the route.
                      type: string
                    interface:
                      description: Interface is the network interface used to reach
                        the destination network.
                      type: string
                    metric:
                      description: Metric is the route priority. Lower values are
                        preferred.
                      format: int32
                      type: integer
                    network:
                      description: Network is the destination CIDR for the static
                        route.
                      type: string
                  required:
                  - interface
                  - network
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
